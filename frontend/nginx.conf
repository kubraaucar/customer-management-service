# Serves the built React app and forwards API calls to the backend container,
# so the browser talks to a single address and no CORS setup is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and Swagger UI -> Spring Boot ("backend" is the service name in docker-compose.yml).
    location ~ ^/(api/|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so browsers may keep them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the app itself; index.html must always be fresh so new versions load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
