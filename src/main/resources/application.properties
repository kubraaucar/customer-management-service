spring.application.name=customer-management-service

# Database connection. Defaults match docker-compose.yml; override with environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# Tables are created by Flyway (src/main/resources/db/migration); Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Paging: ?page=0&size=20&sort=name,asc
spring.data.web.pageable.max-page-size=100

# Frontend addresses allowed to call the API (comma separated). 5173 is the Vite dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
