spring.application.name=customer-management-service

# Database connection. Defaults match docker-compose.yml; override with environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# Tables are created by Flyway (src/main/resources/db/migration); Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Paging: ?page=0&size=20&sort=name,asc
spring.data.web.pageable.max-page-size=100

# Frontend addresses allowed to call the API (comma separated). 5173 is the Vite dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Login ----
# The defaults below are for local development only. In production (the "prod" profile)
# JWT_SECRET and ADMIN_PASSWORD must be set, otherwise the app does not start.
# Key that signs login tokens (at least 32 characters). Changing it logs everyone out.
app.security.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-0123456789}
# How long a login stays valid, e.g. 30m, 8h, 1d.
app.security.jwt.expiration=${JWT_EXPIRATION:8h}
# Administrator account, created (or its password updated) at startup.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin12345}
# "Demo olarak dene" button: read-only access without a password.
app.security.demo.enabled=${DEMO_ENABLED:true}
app.security.demo.username=demo
