# Production settings, used when the app runs with SPRING_PROFILES_ACTIVE=prod.

# These default to empty on purpose: validation then stops the app until they are set, so the
# public development defaults can never be used in production. (Without the ":" Spring would keep
# the text "${ADMIN_PASSWORD}" itself as the password.)
app.security.jwt.secret=${JWT_SECRET:}
app.security.admin.password=${ADMIN_PASSWORD:}

# The hosting service sits in front of the app (HTTPS ends there); trust its X-Forwarded-* headers
# so links the app builds (e.g. the Location header) use the public https address.
server.forward-headers-strategy=native

# No SQL statements in the logs.
spring.jpa.show-sql=false
