# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repository. Values marked "sync: false" are asked for
# during setup and are never stored in the repository.
services:
  - type: web
    name: customer-management-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Random key for signing login tokens, created by Render.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_ENABLED
        value: "true"
      # Also load the made-up example customers (src/main/resources/db/sample-data).
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/sample-data
      # Database (e.g. Neon): jdbc:postgresql://<host>/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Address of the deployed frontend, e.g. https://customer-management.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
