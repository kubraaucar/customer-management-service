# Runs on every push to main and on every pull request:
# backend tests, frontend checks, then builds the Docker images and starts the whole app once.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch cancels the older, still running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit and web tests, plus integration tests against a real PostgreSQL (Testcontainers).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images and smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the images and start the app
        run: docker compose up -d --build --wait --wait-timeout 180 postgresql backend frontend
      - name: Check the app answers through nginx
        run: |
          curl --fail --silent --show-error http://localhost:3000/ > /dev/null
          curl --fail --silent --show-error -X POST http://localhost:3000/api/auth/demo > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/customers)" = "401"
      - name: Show container logs
        if: failure()
        run: docker compose logs backend frontend
      - name: Stop the app
        if: always()
        run: docker compose down -v
